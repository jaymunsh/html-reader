<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF0F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)" />
    <!-- First-frame theme: mirrors bootTheme()/applyTheme() in src/ui/chrome.ts (localStorage 'theme', else the system scheme). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          var c = t === 'dark' ? '#101216' : '#EEF0F4', m = document.querySelectorAll('meta[name=theme-color]');
          for (var i = 0; i < m.length; i++) m[i].setAttribute('content', c);
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/__app/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/__app/icons/apple-touch-icon.png" />
    <link rel="preload" href="/__app/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
    <title>HTML Reader</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
